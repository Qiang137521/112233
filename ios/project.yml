name: TorrentBox
options:
  bundleIdPrefix: com.torrentbox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BoxCore:
    path: BoxCore
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: 3.6.0
targets:
  TorrentBox:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: TorrentBox
    dependencies:
      - package: BoxCore
        product: TorrentKit
      - package: BoxCore
        product: ArchiveKit
      - package: VLCKitSPM
        product: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.torrentbox.app
        PRODUCT_NAME: TorrentBox
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: TorrentBox/Info.plist
      properties:
        CFBundleDisplayName: TorrentBox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Expose Documents in the Files app
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 用于与局域网内的 BT 节点传输数据。
        CFBundleURLTypes:
          - CFBundleURLName: magnet
            CFBundleURLSchemes:
              - magnet
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent 种子
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - torrent
              public.mime-type:
                - application/x-bittorrent
          - UTTypeIdentifier: com.rarlab.rar-archive
            UTTypeDescription: RAR 压缩包
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - rar
          - UTTypeIdentifier: org.7-zip.7-zip-archive
            UTTypeDescription: 7z 压缩包
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - 7z
        CFBundleDocumentTypes:
          - CFBundleTypeName: BitTorrent 种子
            LSHandlerRank: Owner
            LSItemContentTypes:
              - org.bittorrent.torrent
          - CFBundleTypeName: 压缩包
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - com.rarlab.rar-archive
              - org.7-zip.7-zip-archive
              - org.gnu.gnu-zip-archive
              - public.tar-archive
              - public.bzip2-archive
          - CFBundleTypeName: 媒体
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.audio
