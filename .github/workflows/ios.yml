name: iOS app

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Unit tests
        working-directory: ios/BoxCore
        run: swift test
      - name: End-to-end BitTorrent test against libtorrent
        working-directory: ios/BoxCore
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q libtorrent
          PYTHON=/tmp/venv/bin/python ./Scripts/e2e_test.sh

  app:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          xcodebuild -version
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        working-directory: ios
        run: |
          xcodebuild -project TorrentBox.xcodeproj -scheme TorrentBox -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:|fatal" -A4 build.log | head -150; tail -40 build.log; exit 1; }
          grep -c "warning:" build.log || true
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TorrentBox.app Payload/
          zip -qry TorrentBox-unsigned.ipa Payload
          ls -la TorrentBox-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TorrentBox-unsigned-ipa
          path: ios/TorrentBox-unsigned.ipa
